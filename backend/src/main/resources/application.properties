server.port=${PORT:8080}

# Database: H2 in-memory by default (zero setup). For PostgreSQL set DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:h2:mem:peernet;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=24

# CORS (comma separated list of allowed frontend origins)
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Seed data passwords
app.seed.demo-data=${SEED_DEMO_DATA:false}
app.seed.admin-password=${ADMIN_PASSWORD:}

# Cache: "simple" (in memory) by default, set CACHE_TYPE=redis to use Redis
spring.cache.type=${CACHE_TYPE:simple}
spring.cache.redis.time-to-live=60s
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
